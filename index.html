<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-Search-App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1><span>Image</span>Search App</h1>
    <form>
        <input type="text" id="search-id" placeholder="Search for images....." />
        <button id="search-button">Search</button>
    </form>

    <div class="search-results">
        <div class="search-result" data-search="flowers">
            <img src="https://media.istockphoto.com/id/490787358/photo/sunflower.jpg?s=612x612&w=0&k=20&c=b3s_0jh8ObGqlvcxwGQX31bgtJUE7T_ud6AHpvX0POk="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Flowers Collection</a>
        </div>

        <div class="search-result" data-search="nature">
            <img src="https://plus.unsplash.com/premium_photo-1711434824963-ca894373272e?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bmF0dXJlfGVufDB8fDB8fHww"
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Beauty of Earth</a>
        </div>

        <div class="search-result" data-search="ocaen-waves">
            <img src="https://plus.unsplash.com/premium_photo-1669018130437-7cf2eb36af1c?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8c2VhfGVufDB8fDB8fHww"
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Waves & Shoreline Views</a>
        </div>

        <div class="search-result" data-search="mountains">
            <img src="https://media.istockphoto.com/id/1341288649/photo/75mpix-panorama-of-beautiful-mount-ama-dablam-in-himalayas-nepal.jpg?s=612x612&w=0&k=20&c=0xb_bb-NBIxjiJL_kqY-o3dCjv2PmKFZfRjHcVEijDc="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Natural Scenery</a>
        </div>

        <div class="search-result" data-search="travel india">
            <img src="https://media.istockphoto.com/id/1045842092/photo/historic-agra-fort-with-white-marble-dome-architecture-and-carvings-and-portico-structure.jpg?s=612x612&w=0&k=20&c=SujLSrCRJ4Uh5jKPJ1Nge7D0KFgxZ1t5prME8OxqhuE="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Travel Inspiration Gallery</a>
        </div>

        <div class="search-result" data-search="fruits">
            <img src="https://media.istockphoto.com/id/1177922936/photo/fresh-sliced-tropical-fruits-berries-in-container-delicious-healthy-snack-ready-to-eat-salad.jpg?s=612x612&w=0&k=20&c=KVeUwZcQm6tROdcNXdWK8trsmQT8hfQVxTSvKf_NLrs="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Fresh Fruits</a>
        </div>

        <div class="search-result" data-search="desert">
            <img src="https://media.istockphoto.com/id/521016602/photo/indian-woman-with-little-daughter-carrying-water-from-well.jpg?s=612x612&w=0&k=20&c=vyfWFJvS4rbHIOXiUEtHr3twbat_rnyw_vSaWeVdatw="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Desert Life</a>
        </div>

        <div class="search-result" data-search="desserts">
            <img src="https://media.istockphoto.com/id/517368976/photo/slice-of-dessert.jpg?s=612x612&w=0&k=20&c=fS6QBm88-tmGNHbl7ePpHiysNsCgBJ8D1ZPtabLwH-0="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Delicious Desserts</a>

        <div class="search-result" data-search="underwater">
            <img src="https://media.istockphoto.com/id/472563478/photo/underwater-world-with-corals-and-tropical-fish.jpg?s=612x612&w=0&k=20&c=W15vZgkJE5wmgrt2WY43-fS_whn32ouMc8wT18olEjk="
                alt="image">
            <a href="" target="_blank" rel="noopener noreferrer">Underwater World</a>
        </div>


    </div>

    <button id="show-more-button">Show more</button>
    <footer>
        <p>© 2025 Image Search App | Designed & Developed by <strong>Anshika</strong></p>
    </footer>


    <script src="app.js"></script>
